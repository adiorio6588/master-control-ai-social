<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <h2>🤖 Master Control</h2>

    <button>Dashboard</button>
    <button>Comments</button>
    <button>Businesses</button>
    <button>Analytics</button>
    <button>Settings</button>

</div>

<div class="content">

    <h1>AI Social Media Assistant</h1>

    <div class="card">

        <h3>Customer Comment</h3>

        <textarea
        id="comment"
        placeholder="Paste a customer comment here..."
        ></textarea>

        <button id="generate">
            Generate AI Reply
        </button>

    </div>

    <div class="card">

        <h3>AI Reply</h3>

        <textarea
        id="reply"
        placeholder="Your AI reply will appear here..."
        ></textarea>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
