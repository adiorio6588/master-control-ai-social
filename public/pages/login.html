<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Master Control
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body class="login-page">

    <main class="login-shell">

        <section class="login-card">

            <div class="login-brand">

                <div class="login-logo">
                    MC
                </div>

                <div>

                    <h1>
                        Master Control
                    </h1>

                    <p>
                        Business Operating System
                    </p>

                </div>

            </div>


            <div class="login-heading">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Sign in to your Master Control account.
                </p>

            </div>


            <form id="login-form">

                <div class="login-field">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        id="login-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@business.com"
                        required
                    >

                </div>


                <div class="login-field">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        id="login-password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    id="login-button"
                    class="login-button"
                    type="submit"
                >
                    Sign In
                </button>


                <p
                    id="login-message"
                    class="login-message"
                    aria-live="polite"
                ></p>

            </form>


            <div class="login-footer">

                <span class="status-dot"></span>

                Secure Master Control Access

            </div>

        </section>

    </main>


    <script src="/js/login.js"></script>

</body>

</html>
