<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Account | Master Control
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css?v=52"
    >

</head>


<body class="login-page">

    <main class="login-shell">

        <section class="login-command-panel">


            <aside class="login-brand-panel">

                <div class="login-brand">

                    <div class="login-logo">
                        MC
                    </div>

                    <div>

                        <h1>
                            Master Control
                        </h1>

                        <p>
                            Business Operating System
                        </p>

                    </div>

                </div>


                <div class="login-brand-divider"></div>


                <div class="login-system-info">

                    <div class="login-system-status">

                        <span class="status-dot"></span>

                        <div>

                            <strong>
                                SYSTEM ONLINE
                            </strong>

                            <p>
                                Account Provisioning
                            </p>

                        </div>

                    </div>

                </div>

            </aside>


            <section class="login-form-panel">

                <div class="login-system-label">
                    MASTER CONTROL // NEW ACCOUNT
                </div>


                <div class="login-heading">

                    <h2>
                        Create Account
                    </h2>

                    <p>
                        Create your Master Control workspace.
                    </p>

                </div>


                <form id="register-form">

                    <div class="login-field">

                        <label for="register-name">
                            Your Name
                        </label>

                        <input
                            id="register-name"
                            name="displayName"
                            type="text"
                            autocomplete="name"
                            placeholder="Your name"
                            required
                        >

                    </div>


                    <div class="login-field">

                        <label for="register-email">
                            Email
                        </label>

                        <input
                            id="register-email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="you@business.com"
                            required
                        >

                    </div>


                    <div class="login-field">

                        <label for="register-organization">
                            Organization / Business Name
                        </label>

                        <input
                            id="register-organization"
                            name="organizationName"
                            type="text"
                            autocomplete="organization"
                            placeholder="Example: Acme Foods"
                            required
                        >

                    </div>


                    <div class="login-field">

                        <label for="register-password">
                            Password
                        </label>

                        <input
                            id="register-password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="At least 8 characters"
                            minlength="8"
                            required
                        >

                    </div>


                    <button
                        id="register-button"
                        class="login-button"
                        type="submit"
                    >
                        Create Account
                    </button>


                    <p
                        id="register-message"
                        class="login-message"
                        aria-live="polite"
                    ></p>

                </form>


                <div class="login-access-footer">

                    <span>
                        ALREADY HAVE AN ACCOUNT?
                    </span>

                    <a href="/login">
                        SIGN IN
                    </a>

                </div>

            </section>


        </section>

    </main>


    <script src="/js/register.js"></script>

</body>

</html>
