<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Rules Manager | Master Control
    </title>

    <link
        rel="stylesheet"
        href="/css/design-system.css"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/rules.css"
    >

</head>


<body>

    <aside class="sidebar">

        <h2>
            Master Control
        </h2>


        <button
            type="button"
            onclick="location.href='/dashboard'"
        >
            Dashboard
        </button>


        <button
            type="button"
            onclick="location.href='/inbox'"
        >
            Social Inbox
        </button>


        <button
            type="button"
            onclick="location.href='/businesses'"
        >
            Businesses
        </button>


        <button
            type="button"
            class="active-nav"
        >
            Rules
        </button>


        <button type="button">
            Analytics
        </button>


        <button type="button">
            Automation
        </button>


        <button type="button">
            Settings
        </button>


        <button
            class="sidebar-logout"
            type="button"
            onclick="MasterControlAuth.logout()"
        >
            LOGOUT
        </button>


        <div class="sidebar-system-status">

            <span class="online-light"></span>

            <div>

                <strong>
                    System Online
                </strong>

                <p>
                    Rules engine active
                </p>

            </div>

        </div>

    </aside>


    <main class="content">

        <header class="page-header">

            <div>

                <p>
                    MASTER CONTROL // AUTOMATION
                </p>

                <h2>
                    Rules Manager
                </h2>

                <span>
                    Create automatic replies that run before the paid AI service.
                </span>

            </div>


            <button
                id="new-rule-button"
                class="primary-button"
                type="button"
            >
                + New Rule
            </button>

        </header>


        <section class="toolbar">

            <div class="field">

                <label for="business-filter">
                    Business
                </label>

                <select id="business-filter">

                    <option value="">
                        All businesses
                    </option>

                </select>

            </div>


            <div class="toolbar-stat">

                <span>
                    Rules Loaded
                </span>

                <strong id="rule-count">
                    0
                </strong>

            </div>


            <div class="toolbar-stat">

                <span>
                    Enabled
                </span>

                <strong id="enabled-count">
                    0
                </strong>

            </div>

        </section>


        <section
            id="message-box"
            class="message-box hidden"
        ></section>


        <section
            id="rules-list"
            class="rules-list"
        >

            <div class="empty-state">
                Loading automatic reply rules...
            </div>

        </section>

    </main>


    <!-- ===================================================== -->
    <!-- Rule Modal                                             -->
    <!-- ===================================================== -->

    <div
        id="rule-modal"
        class="modal hidden"
    >

        <div
            class="modal-backdrop"
            id="modal-backdrop"
        ></div>


        <section class="modal-panel">

            <div class="modal-header">

                <div>

                    <p>
                        RULE CONFIGURATION
                    </p>

                    <h2 id="modal-title">
                        Create Rule
                    </h2>

                </div>


                <button
                    id="close-modal-button"
                    class="icon-button"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="rule-form">

                <input
                    id="rule-id"
                    type="hidden"
                >


                <div class="field">

                    <label for="rule-business">
                        Business
                    </label>

                    <select
                        id="rule-business"
                        required
                    >

                        <option value="">
                            Select a business
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="rule-name">
                        Rule Name
                    </label>

                    <input
                        id="rule-name"
                        type="text"
                        placeholder="Example: Delivery"
                        required
                    >

                </div>


                <div class="field">

                    <label for="rule-keywords">
                        Keywords
                    </label>

                    <input
                        id="rule-keywords"
                        type="text"
                        placeholder="deliver, delivery, shipping"
                        required
                    >

                    <small>
                        Separate each keyword or phrase with a comma.
                    </small>

                </div>


                <div class="field">

                    <label for="rule-reply">
                        Automatic Reply
                    </label>

                    <textarea
                        id="rule-reply"
                        placeholder="Write the reply that should be sent when this rule matches..."
                        required
                    ></textarea>

                </div>


                <label class="checkbox-row">

                    <input
                        id="rule-enabled"
                        type="checkbox"
                        checked
                    >

                    <span>
                        Rule enabled
                    </span>

                </label>


                <div class="form-actions">

                    <button
                        id="cancel-button"
                        class="secondary-button"
                        type="button"
                    >
                        Cancel
                    </button>


                    <button
                        id="save-rule-button"
                        class="primary-button"
                        type="submit"
                    >
                        Save Rule
                    </button>

                </div>

            </form>

        </section>

    </div>

    <script src="/js/core/auth.js?v=1"></script>
    <script src="/js/core/api.js?v=50"></script>
    <script src="/js/rules.js"></script>

    <script>
        MasterControlAuth.requireAuth();
    </script>

</body>

</html>
